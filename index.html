<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nascente Contábil · Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #eff6ff 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: #fff; border-radius: 20px; padding: 44px 40px;
    width: 420px; max-width: calc(100vw - 32px);
    box-shadow: 0 8px 40px rgba(0,0,0,.10);
  }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .logo-icon {
    width: 48px; height: 48px; background: #3b82f6; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; font-weight: 800;
  }
  .logo-text { font-size: 18px; font-weight: 800; color: #1e293b; }
  .logo-sub { font-size: 12px; color: #94a3b8; }
  h1 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
  input {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: 14px; color: #1e293b; outline: none;
    transition: border .15s;
  }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
  .btn-login {
    width: 100%; padding: 13px; background: #3b82f6; color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background .15s; margin-top: 8px;
  }
  .btn-login:hover { background: #2563eb; }
  .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }
  .btn-link {
    background: none; border: none; color: #3b82f6; font-size: 13px;
    cursor: pointer; text-decoration: underline; padding: 0; margin-top: 12px;
    display: block; text-align: center; width: 100%;
  }
  .btn-link:hover { color: #2563eb; }
  .error-msg {
    background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; display: none;
  }
  .success-msg {
    background: #f0fdf4; border: 1px solid #86efac; color: #16a34a;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; display: none;
  }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">N</div>
    <div>
      <div class="logo-text">Nascente Contábil</div>
      <div class="logo-sub">Gestor de Tarefas</div>
    </div>
  </div>

  <!-- Tela de login -->
  <div id="tela-login">
    <h1>Bem-vindo! 👋</h1>
    <div class="subtitle">Faça login para acessar o sistema</div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="login()">Entrar</button>
    <button class="btn-link" onclick="mostrarRecuperacao()">Esqueci minha senha</button>
  </div>

  <!-- Tela de recuperação de senha -->
  <div id="tela-recuperacao" style="display:none">
    <h1>Recuperar senha</h1>
    <div class="subtitle">Digite seu e-mail para receber o link de redefinição</div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="email-rec" placeholder="seu@email.com">
    </div>
    <button class="btn-login" id="btn-rec" onclick="enviarRecuperacao()">Enviar link</button>
    <button class="btn-link" onclick="mostrarLogin()">Voltar ao login</button>
  </div>

  <!-- Tela de nova senha (após clicar no link do email) -->
  <div id="tela-nova-senha" style="display:none">
    <h1>Nova senha</h1>
    <div class="subtitle">Digite e confirme sua nova senha</div>
    <div class="form-group">
      <label>Nova senha</label>
      <input type="password" id="nova-senha" placeholder="••••••••">
    </div>
    <div class="form-group">
      <label>Confirmar senha</label>
      <input type="password" id="confirmar-senha" placeholder="••••••••">
    </div>
    <button class="btn-login" id="btn-nova" onclick="salvarNovaSenha()">Salvar nova senha</button>
  </div>

  <div class="error-msg" id="error-msg"></div>
  <div class="success-msg" id="success-msg"></div>
  <div class="footer">Nascente Contábil © 2026</div>
</div>

<script>
const SUPABASE_URL = 'https://csvdfarfpooxbuiwbnas.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmRmYXJmcG9veGJ1aXdobmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTg4NTQsImV4cCI6MjA5NjU5NDg1NH0.P8xzLOm9A0NSnui4Yq9iEFuPty6CMmFV1WXR7PGhHEs';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Detecta se veio de um link de recuperação de senha
const hash = window.location.hash;
if (hash.includes('type=recovery') || (hash.includes('access_token') && hash.includes('type=recovery'))) {
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-nova-senha').style.display = 'block';
} else {
  // Se já está logado, redireciona
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/app.html';
  });
}

// Também escuta eventos de auth para capturar o token de recovery
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-recuperacao').style.display = 'none';
    document.getElementById('tela-nova-senha').style.display = 'block';
  }
  if (event === 'SIGNED_IN' && !window.location.hash.includes('type=recovery')) {
    window.location.href = '/app.html';
  }
});

document.getElementById('senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

async function login() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn-login');
  hideMessages();

  if (!email || !senha) { showError('Preencha e-mail e senha.'); return; }

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });

  if (error) {
    showError('E-mail ou senha incorretos.');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  } else {
    window.location.href = '/app.html';
  }
}

function mostrarRecuperacao() {
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-recuperacao').style.display = 'block';
  hideMessages();
}

function mostrarLogin() {
  document.getElementById('tela-recuperacao').style.display = 'none';
  document.getElementById('tela-login').style.display = 'block';
  hideMessages();
}

async function enviarRecuperacao() {
  const email = document.getElementById('email-rec').value.trim();
  const btn = document.getElementById('btn-rec');
  hideMessages();

  if (!email) { showError('Digite seu e-mail.'); return; }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://gestordetarefas-psi.vercel.app/'
  });

  if (error) {
    showError('Erro ao enviar. Verifique o e-mail digitado.');
  } else {
    showSuccess('Link enviado! Verifique sua caixa de entrada.');
  }

  btn.disabled = false;
  btn.textContent = 'Enviar link';
}

async function salvarNovaSenha() {
  const nova = document.getElementById('nova-senha').value;
  const confirmar = document.getElementById('confirmar-senha').value;
  const btn = document.getElementById('btn-nova');
  hideMessages();

  if (!nova || !confirmar) { showError('Preencha os dois campos.'); return; }
  if (nova !== confirmar) { showError('As senhas não coincidem.'); return; }
  if (nova.length < 6) { showError('A senha deve ter pelo menos 6 caracteres.'); return; }

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const { error } = await sb.auth.updateUser({ password: nova });

  if (error) {
    showError('Erro ao salvar. Solicite um novo link de recuperação.');
    btn.disabled = false;
    btn.textContent = 'Salvar nova senha';
  } else {
    showSuccess('Senha alterada com sucesso! Redirecionando...');
    setTimeout(() => window.location.href = '/app.html', 2000);
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}

function hideMessages() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('success-msg').style.display = 'none';
}
</script>
</body>
</html>
